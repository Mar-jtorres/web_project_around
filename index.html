<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--SEO-->
    <meta
      name="description"
      content="Around Mexico"
    />
    <meta
      name="keywords"
      content="viajes, paises, lugares, origen"
    />
    <meta name="author" content="Marjtorres" />
    <!--TITLE-->
  <title>Around CDMX</title>
    <!--ESTILOS-->
    <link rel="stylesheet" href="./pages/index.css">
    <!--FUENTES-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap" rel="stylesheet">
</head>
<body>
 <div class="page">
    
 <header class="header">
    <!-- Logo/título -->
<img class="header__title" src="./Images/Around.png">
<img class="header__line" src="./Images/Line.png">
  </header>
  <main class="content">
    <!-- Sección de perfil y galería -->
  <section class="profile">
    <img src="./Images/profile-maria.jpeg" class="profile__pic">
    <div class="profile__name">
    <h2 class="profile__info">Maria Torres</h2>
    <img src="./Images/Edit-Button.png" class="profile__edit-button" id="edit-button">
    </div>
    <p class="profile__sub">Developer, Ethical Hacker</p>
    
    <img src="./Images/Add-Button.png" class="profile__add-button" id="add-button">
  </section>

  <!--POPUP-->
<div class="popup" id="popup-new-card">
  <div class="popup__container">
    <button class="popup__close" id="close-new-card-button" type="button">
      <img src="./Images/Close-Icon.svg" alt="Cerrar" class="popup__close-icon">
    </button>
    <h4 class="popup__text">Nuevo lugar</h4>
    <form class="popup__form" id="new-card-form">
      <input type="text" name="place-name" placeholder="Título" class="popup__input" required>
      <input type="url" name="link" placeholder="Enlace a la imagen" class="popup__input" required>
      <button type="submit" class="popup__submit">Crear</button>
    </form>
  </div>
</div>
  <!-- POPUP EDITAR PERFIL-->
   <div class="popup" id="popup">

    <div class="popup__container">
        <button class="popup__close" id="close-button">
        <img src="./Images/Close-Icon.svg" alt="Cerrar" class="popup__close-icon">
       </button>
      <h4 class="popup__text">Editar Perfil</h4>
      <form class="popup__form">
        <input type="text" name="name" placeholder="Nombre" class="popup__input">
        <textarea name="about" placeholder="Acerca de mí" class="popup__textarea"></textarea>
        <button type="submit" class="popup__submit">Guardar</button></form>
      
    </div>
   
   </div>
   <!-- POPUP IMAGEN GALERIA-->
   <div class="popup popup_type_image" id="popup_type_image">
    <div class="popup__container popup__container_type_image">
    <button class="popup__close-button" type="button"><img src="./Images/Close-Icon.svg" alt="Cerrar" class="popup__close-icon"></button>
    <img class="popup__image" src="" alt="">
    <h2 class="popup__title"></h2>
    </div>
   </div>
        <!-- POPUP ADD IMAGE-->
   <div class="popup" id="add-card-popup">

    <div class="popup__container-add">
        <button class="popup__close-add" id="close-button-add">
        <img src="./Images/Close-Icon.svg" alt="Cerrar" class="popup__close-icon">
       </button>
      <h4 class="popup__add-img-text">Nuevo Lugar</h4>
      <form class="popup__form" id="add-card-form">
        <!--campos del formulario add neew card-->  
        <input type="text" name="place-name" placeholder="Titulo" class="popup__input">
        <input type="url" name="link" placeholder="Enlace a la Imagen" class="popup__input">

        <button type="submit" class="popup__submit">Guardar</button></form>
    </div>
   </div>
  <section class="elements">
   <template id="user">
  <div class="user">
    <img class="user__avatar" alt="avatar" src="">
    <div></div>
    <h3></h3>
    <button></button>
    <img src="" alt="">
  </div>
</template>
  </section>
  </main>
 <footer class="footer">
    <p class="footer__copyright">© 2026 Around CDMX.</p>
 </footer>
 </div>
 <script src="./scripts/index.js"></script>
</body>
</html>
